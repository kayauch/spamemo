[project]
name = "spatial-memory-hackathon"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
spatial-recon = "spatial_recon.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["third_party", ".venv", "data"]
