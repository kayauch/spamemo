<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>部屋構造の推定を確認</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101720;color:#edf3fb;font:15px/1.6 system-ui,sans-serif}header{padding:20px 26px;border-bottom:1px solid #304051}h1{font-size:22px;margin:0}p{margin:8px 0;color:#bdcbd9}main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;padding:20px}.stage{height:65vh;min-height:400px;border:1px solid #354354;border-radius:12px;overflow:hidden;position:relative}canvas{display:block}.hint{position:absolute;bottom:12px;left:16px;background:#101720cc;padding:4px 10px;pointer-events:none}.panel{background:#192430;padding:18px;border-radius:12px}label{display:block;margin:9px 0;cursor:pointer}button{background:#284b6b;border:1px solid #53799b;border-radius:6px;color:white;padding:7px 12px;cursor:pointer;margin:5px}input{accent-color:#63c8ff}.tag{color:#ffcf7a}.small{font-size:13px}.legend{display:flex;flex-wrap:wrap;gap:8px}.legend span{border-left:5px solid;padding:2px 8px;background:#0e1822}.refs{padding:0 20px 30px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.refs figure{margin:0}.refs img{width:100%;border-radius:8px}.refs figcaption{font-size:12px;color:#bdcbd9}#error{color:#ffadad;white-space:pre-wrap}a{color:#8cd4ff}@media(max-width:850px){main{grid-template-columns:1fr}.refs{grid-template-columns:repeat(2,1fr)}}
</style>
<script type="importmap">{"imports":{"three":"/static/vendor/three.module.js"}}</script></head>
<body><header><h1>観測した部屋 → 構造の推定</h1><p>実写の点群と、AIが推定した壁・家具の位置を比べます。元の部屋表示は変更していません。</p><div id="status" class="tag">読み込み中…</div></header>
<main><section><div class="stage" id="stage"><div class="hint">ドラッグ：回転 ／ ホイール：拡大 ／ 右ドラッグ：移動</div></div><div><button id="overview">斜めから見る</button><button id="top">真上から見る</button><button id="pointsOnly">点群だけ</button><button id="layoutOnly">推定だけ</button></div><div id="legend" class="legend"></div></section>
<aside class="panel"><label>比較する結果 <select id="predictions" style="width:100%;padding:8px;background:#101720;color:white;border:1px solid #53799b;border-radius:6px"></select></label><strong>比較する表示</strong><label><input type="checkbox" id="points" checked> 実写由来の点群</label><label><input type="checkbox" id="layout" checked> SpatialLMの推定</label><label><input type="checkbox" id="baseline"> 既存の構造モデル（灰色）</label><label>点の大きさ <input id="pointSize" type="range" min="1" max="5" value="2"></label><p id="counts"></p><p class="tag">まだ生成用の確定レイアウトではありません。</p><p class="small">点が箱の中にあることだけでは、その物体名が正しいとは言えません。窓・扉・収納の種類と位置を下の実写で確認します。</p><p class="small" id="scale"></p><p class="small" id="orientation"></p><p class="small">新しい部屋の生成（SpatialGen）は未実行です。</p><a id="json" target="_blank">結果と変換条件を開く</a><div id="error"></div></aside></main>
<div class="refs" id="refs"></div><script type="module" src="/static/generation-review.js"></script></body></html>
