<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写真とのずれを補正 | スパメモ</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1723;color:#edf4fc;font:16px/1.65 system-ui,sans-serif}main{max-width:980px;margin:auto;padding:24px 18px 64px}a{color:#83c0ff}h1{font-size:25px;margin-bottom:8px}h2{font-size:19px}p{color:#b9c9d9}button,.action{display:inline-block;border:1px solid #35516b;border-radius:10px;background:#192c3e;color:white;padding:12px 18px;font:inherit;cursor:pointer;text-decoration:none}button.primary,.action.primary{background:#167af1;border-color:#167af1}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap}.card{padding:20px;margin:20px 0;border:1px solid #294057;border-radius:15px;background:#102131}[hidden]{display:none!important}#status{white-space:pre-wrap}#error{color:#ffb6ab}select{max-width:100%;padding:10px;font:inherit;border-radius:8px;background:#192c3e;color:white}.photos{display:grid;grid-template-columns:1fr 1fr;gap:14px}figure{margin:15px 0}img{width:100%;height:auto;border-radius:8px;background:#08111b}figcaption{color:#bbcbdb}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:10px 5px;border-bottom:1px solid #294057}small{color:#acbccb}button[aria-pressed=true]{border-color:#5eb2ff;background:#205185}@media(max-width:620px){.photos{grid-template-columns:1fr}.card{padding:14px}h1{font-size:23px}}
</style></head><body><main><a id="back">← 部屋に戻る</a><h1>写真とのずれを補正</h1><p>保存済みの写真から、カメラ・床・壁の位置を見直します。別の写真でも一致が良くなる補正だけを採用します。</p>
<section class="card"><div class="actions"><button id="start" class="primary" disabled>写真とのずれを補正する</button><a id="result" class="action primary" hidden>補正後の部屋を見る</a><a id="before" class="action" hidden>補正前の部屋を見る</a></div><p id="status" role="status" aria-live="polite">部屋を確認しています…</p><p id="error" role="alert"></p><small>元の写真と部屋は残ります。写っていない面や、根拠が足りない部分は無理に埋めません。</small></section>
<section id="review" hidden><h2>元写真で補正前後を確認</h2><label for="frame">確認する写真 </label><select id="frame"></select><p><button id="lines" aria-pressed="true">輪郭線を表示</button></p><small>青い線は床・壁、黄色い線は天井です。家具の奥など、実際には隠れている輪郭も表示しています。</small><div class="photos"><figure><figcaption>補正前</figcaption><img id="oldImage" alt="元写真に重ねた補正前の部屋の輪郭"></figure><figure><figcaption>補正後</figcaption><img id="newImage" alt="元写真に重ねた補正後の部屋の輪郭"></figure></div><section class="card"><h2>確認結果</h2><p id="summary"></p><p id="coverage"></p><details><summary>カメラ位置の確認結果</summary><p id="cameraChecks"></p></details><table><thead><tr><th>場所</th><th>結果</th></tr></thead><tbody id="checks"></tbody></table><p>補正できなかった面は、位置のずれ以外に、未撮影・遮蔽物・壁や家具の認識不足が原因の場合もあります。</p></section></section>
</main><script type="module" src="/static/photo-alignment.mjs?v=20260926-align2"></script></body></html>
